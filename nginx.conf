server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache the SPA shell — it must always point to latest hashed assets
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # handle SPA (Vite/React/Vue/Angular) routes
    location / {
        try_files $uri $uri/ /index.html;
        # HTML fallback responses should also stay fresh
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are safe to cache long-term
    location /assets/ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location ~* \.(png|jpg|jpeg|gif|ico|svg|json|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
