    <script>
      function openSidebar() {
        document.getElementById('navbarNav').classList.add('show');
      }

      function closeSidebar() {
        document.getElementById('navbarNav').classList.remove('show');
      }

      const toggleArrow = document.getElementById('toggleArrow1');
      const extraCards = document.querySelectorAll('.extra_card');
      const arrowImage = toggleArrow.querySelector('img');

      let expanded = false;

      toggleArrow.addEventListener('click', () => {
        expanded = !expanded;

        extraCards.forEach((card) => card.classList.toggle('d-none'));
        toggleArrow.classList.toggle('rotate', expanded);

        if (expanded) {
          arrowImage.style.marginBottom = '6px';
        } else {
          arrowImage.style.marginBottom = '4px';
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        const video = document.getElementById('customVideo');
        const playBtn = document.getElementById('playButton');
        const pauseBtn = document.getElementById('pauseButton');
        const wrapper = document.getElementById('videoWrapper');

        playBtn.addEventListener('click', function () {
          video.play();
          playBtn.style.display = 'none';
          wrapper.classList.add('playing');
        });

        pauseBtn.addEventListener('click', function () {
          video.pause();
          wrapper.classList.remove('playing');
          playBtn.style.display = 'block';
        });

        video.addEventListener('pause', function () {
          wrapper.classList.remove('playing');
          playBtn.style.display = 'block';
        });

        video.addEventListener('play', function () {
          wrapper.classList.add('playing');
          playBtn.style.display = 'none';
        });
      });

      document.addEventListener('DOMContentLoaded', function () {
        const slider = document.getElementById('pillSlider');
        const originalContent = slider.innerHTML;
        let scrollInterval;

        function startAutoScroll() {
          if (window.innerWidth >= 575) return;

          if (!slider.dataset.cloned) {
            slider.innerHTML += slider.innerHTML;
            slider.dataset.cloned = 'true';
          }

          const scrollStep = 0.7;

          function scroll() {
            slider.scrollLeft += scrollStep;

            if (slider.scrollLeft >= slider.scrollWidth / 2) {
              slider.scrollLeft = 0;
            }
          }

          scrollInterval = setInterval(scroll, 25);
        }

        function stopAutoScroll() {
          clearInterval(scrollInterval);
          scrollInterval = null;
        }

        function handleResize() {
          if (window.innerWidth >= 575) {
            stopAutoScroll();
            if (slider.dataset.cloned) {
              slider.innerHTML = originalContent;
              delete slider.dataset.cloned;
            }
          } else {
            stopAutoScroll();
            slider.innerHTML = originalContent;
            delete slider.dataset.cloned;
            startAutoScroll();
          }
        }

        handleResize();
        window.addEventListener('resize', handleResize);
      });

      document.addEventListener('DOMContentLoaded', function () {
        const splide = new Splide('#team-slider', {
          type: 'loop',
          perPage: 5,
          gap: '10px',
          pagination: false,
          arrows: false,
          autoplay: true,
          interval: 30000000,
          pauseOnHover: true,
          breakpoints: {
            1200: { perPage: 5 },
            1100: { perPage: 4 },
            992: { perPage: 3 },
            768: { perPage: 3 },
            576: { perPage: 3 },
            420: { perPage: 1 },
          },
        });

        splide.mount();

        document.querySelector('label[for="left"]').addEventListener('click', () => splide.go('<'));
        document
          .querySelector('label[for="right"]')
          .addEventListener('click', () => splide.go('>'));
      });
    </script>
