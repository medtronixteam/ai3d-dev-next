  <!-- Critical CSS Inlined (Above-the-Fold) -->
  <style>
    :root {
      --primary-pink: #de3996;
      --light-pink: #ffedf7;
      --dark-text: #333;
      --light-gray: #f8f9fa
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html,
    body {
      overflow-x: hidden;
      overflow-y: auto;
      font-family: 'DM Sans', sans-serif;
      scroll-behavior: smooth
    }

    .ai_3d_landing .sidebar {
      position: fixed;
      top: 0;
      left: -100%;
      width: 15.625rem;
      height: 100%;
      background-color: #fff;
      box-shadow: .125rem 0 .625rem rgba(0, 0, 0, .1);
      transition: left .3s ease;
      z-index: 9999
    }

    .ai_3d_landing .sidebar.show {
      left: 0
    }

    .ai_3d_landing .a3d-header {
      padding: 1rem 1.5rem;
      transition: all .3s ease;
      position: fixed;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      z-index: 1030
    }

    .a3d-header-scrolled {
      box-shadow: 0 2px 10px rgba(0, 0, 0, .1) !important;
      background: #fff !important;
      max-width: 55rem;
      padding: .6rem .8rem !important;
      margin-top: 10px;
      border-radius: 15px
    }

    .ai_3d_landing .a3d-nav-link {
      color: #374151;
      text-decoration: none
    }

    .ai_3d_landing .a3d-nav-link:hover,
    .ai_3d_landing .a3d-nav-link.active {
      color: var(--primary-pink)
    }

    .ai_3d_landing .a3d-join-btn {
      background: #de3996;
      color: #fff;
      border: 1px solid #fff;
      padding: .5rem 1.5rem;
      border-radius: .3125rem;
      font-weight: 600
    }

    .ai_3d_landing .a3d-title {
      font-family: Manrope, sans-serif;
      font-weight: 800;
      font-size: 2.7rem !important;
      line-height: 1.3
    }

    .LCP-Hero-Title {
      animation: heroFadeIn .8s ease-out forwards;
      will-change: opacity, transform
    }

    .LCP-Hero-Desc {
      animation: heroFadeIn .8s ease-out .2s forwards;
      opacity: 0;
      will-change: opacity, transform
    }

    .ai_3d_landing .a3d-description {
      font-size: 1.15rem;
      color: #4b5563;
      line-height: 1.2
    }

    .ai_3d_landing .a3d-pills-scroll {
      display: flex;
      gap: 1rem;
      margin: 1.5rem 0
    }

    .ai_3d_landing .a3d-pill {
      border: .0625rem solid #000;
      padding: .3rem .4rem;
      border-radius: .3125rem;
      display: flex;
      align-items: center;
      cursor: pointer
    }

    .ai_3d_landing .btn-warning {
      background: #ff9c3e !important;
      color: #fff;
      border: 1px solid #ff9c3e;
      padding: .8rem 1.8rem;
      border-radius: 8px
    }

    @keyframes heroFadeIn {
      0% {
        opacity: 0;
        transform: translateY(30px)
      }

      100% {
        opacity: 1;
        transform: translateY(0)
      }
    }

    @keyframes slideInFromLeft {
      from {
        transform: translateX(-20px);
        opacity: 0
      }

      to {
        transform: translateX(0);
        opacity: 1
      }
    }

    @media (max-width:768px) {
      .ai_3d_landing .a3d-title {
        font-size: 2rem
      }

      .ai_3d_landing .a3d-description {
        font-size: 1rem
      }

      .ai_3d_landing .a3d-pills-scroll {
        overflow-x: auto;
        flex-wrap: nowrap;
        scrollbar-width: none
      }

      .ai_3d_landing .a3d-pills-scroll::-webkit-scrollbar {
        display: none
      }
    }
  </style>
