server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # handle SPA (Vite/React/Vue/Angular) routes
    location / {
        try_files $uri /index.html;
    }

    # cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|json|woff2?)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }
}
